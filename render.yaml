services:
  - type: web
    name: machineguard-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALERT_RISK_THRESHOLD
        value: "50.0"
      - key: OFFLINE_THRESHOLD_SECONDS
        value: "45"
      - key: ANOMALY_ALERT_SCORE_THRESHOLD
        value: "0.0"
